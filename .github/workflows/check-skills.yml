name: Check skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every SKILL.md frontmatter parses (as Claude Code and Codex parse it)
        run: |
          npm install --no-save --no-package-lock yaml@2.6.1
          node tests/frontmatter.mjs
      - name: Text files are clean UTF-8 (no double encoding)
        run: node tests/text-encoding.mjs
      - name: Scripts parse
        run: |
          node -e '
            const fs = require("node:fs"), path = require("node:path"), { execFileSync } = require("node:child_process");
            const walk = d => fs.readdirSync(d, { withFileTypes: true }).flatMap(e => {
              const p = path.join(d, e.name);
              return e.isDirectory() ? walk(p) : /\.(mjs|js)$/i.test(e.name) ? [p] : [];
            });
            for (const f of [...walk("skills/taste-skill/scripts"), ...walk("skills/taste-skill/assets")]) {
              execFileSync(process.execPath, ["--check", f], { stdio: "inherit" });
            }
          '

  atlas:
    name: Taste atlas parses and tests pass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: examples/taste-atlas
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every atlas module parses (node --check)
        shell: bash
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r -d '' f; do
            node --check "$f"; n=$((n+1))
          done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          echo "node --check: $n files ok"
      - name: Atlas unit tests (node --test)
        run: node --test scripts/*.test.mjs
