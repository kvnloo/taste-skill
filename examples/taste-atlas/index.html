<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<!-- X's video CDN refuses requests that carry a foreign referrer; bookmark videos need none. -->
<meta name="referrer" content="no-referrer" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Taste Atlas</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
<svg id="atlas" aria-label="Design taxonomy graph"></svg>
<header class="chrome">
  <div class="brand"><span class="dot"></span>Taste Atlas</div>
  <div class="search"><input id="q" placeholder="Search…" autocomplete="off" /><div id="hits"></div></div>
  <button id="theme" title="Toggle theme (t)">◐</button>
</header>
<aside id="card" class="card"></aside>
<nav id="legend" class="legend"></nav>
<footer class="hint"><span id="stat"></span> · click a node · esc to zoom out · t theme</footer>
<script type="module" src="./src/main.js"></script>
</body>
</html>
