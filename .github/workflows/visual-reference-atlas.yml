name: Visual reference atlas smoke tests
on:
  push:
    branches: ["feature/visual-reference-atlas"]
    paths:
      - "examples/visual-reference-atlas/**"
      - ".github/workflows/visual-reference-atlas.yml"
  pull_request:
    paths:
      - "examples/visual-reference-atlas/**"
      - ".github/workflows/visual-reference-atlas.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    defaults:
      run:
        working-directory: examples/visual-reference-atlas
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependency ranges
        run: npm install --no-audit --no-fund
      - name: Validate graph importer and source URL safety
        run: npm test
      - name: Compile responsive React Flow lab
        run: npm run build
      - name: Headless Chrome render and DOM smoke check
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > /tmp/taste-atlas-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=10000 \
            --window-size=1440,940 --screenshot=atlas-desktop.png http://127.0.0.1:5173/ > /tmp/chrome.log 2>&1
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=10000 \
            --window-size=1440,940 --dump-dom http://127.0.0.1:5173/ > atlas-dom.txt 2>> /tmp/chrome.log
          grep -q 'Reference Atlas' atlas-dom.txt
          grep -q 'Editorial signal' atlas-dom.txt
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=10000 \
            --window-size=390,800 --screenshot=atlas-mobile.png http://127.0.0.1:5173/ >> /tmp/chrome.log 2>&1
          test -s atlas-desktop.png
          test -s atlas-mobile.png
      - name: Upload short-lived visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-visual-qa
          path: |
            examples/visual-reference-atlas/atlas-desktop.png
            examples/visual-reference-atlas/atlas-mobile.png
          retention-days: 2
